[workspace]
# A virtual manifest has no edition to infer the resolver from, so it must be set (VERIFICATION_LOG V78).
resolver = "3"
members = [
    "crates/rustedscreep-consts",
    "crates/rustedscreep-core",
    "crates/rustedscreep-wasm",
]
# Plain `cargo test` / `cargo clippy` in the root skip the cdylib; `-p rustedscreep-wasm` still reaches it (V78).
default-members = [
    "crates/rustedscreep-consts",
    "crates/rustedscreep-core",
]

# Exact pins: a version bump is a deliberate edit plus re-verification (VERIFICATION_LOG V1; ADR-005, ADR-006).
[workspace.dependencies]
screeps-game-api = "=0.23.5"
# The wasm-bindgen CLI must be this exact version; the build script checks it (ADR-001, V4).
wasm-bindgen = "=0.2.130"
# The version screeps-game-api already resolves to (V88); the snapshot reads Game objects with it.
js-sys = "=0.3.107"
console_error_panic_hook = "=0.1.7"
# FxHash maps for the snapshot's id interner (ADR-006; default features only, which is `std`).
rustc-hash = "=2.1.3"
# Logging facade for rustedscreep-wasm (ADR-006, V68), with a minimal logger of its own instead of
# fern (ADR-014). No features (log has no default features): `set_logger` needs none, STATIC_MAX_LEVEL
# stays Trace, and the runtime level from config is `log::set_max_level` (V127, V128).
log = "=0.4.35"
# The workspace's own crates: built from their paths here, and required at this version by the packages
# crates.io gets. Raise it with `[workspace.package]`'s version (docs/RELEASE.md, "Making a release").
rustedscreep-consts = { path = "crates/rustedscreep-consts", version = "0.1.0" }
rustedscreep-core = { path = "crates/rustedscreep-core", version = "0.1.0" }
# Benches for the planner, flow field and combat sim, native only (ADR-006: a dev-dependency of
# rustedscreep-core, default features; MSRV 1.86, so Rust 1.100 builds it).
criterion = "=0.8.2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/jabbott-iii/rustedscreep"
# crates.io's search terms and categories. Each crate names its own README (`readme`): inherited, the path would
# resolve from this root.
keywords = ["screeps", "bot", "game-ai", "wasm", "mmo"]
categories = ["games", "game-development"]
# The release workflow publishes every crate to crates.io, and only there (docs/RELEASE.md, ADR-034).
publish = ["crates-io"]

# Profiles apply only from this root manifest; member manifests' profiles are ignored (V79).
# `cargo bench` inherits this profile but always unwinds; `cargo test` uses dev (V80).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# "debuginfo", not `true`/"symbols": stripping symbols also drops the `target_features` section, and
# wasm-bindgen 0.2.130 then cannot detect the module's wasm features (V81, VERIFICATION_LOG D7).
strip = "debuginfo"
