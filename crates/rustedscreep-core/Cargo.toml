[package]
name = "rustedscreep-core"
description = "Decision logic for rustedscreep, a Screeps: World bot: scheduler, movement, spawning, economy, base planner, remote mining, and defense, in pure Rust that tests natively."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
rustc-hash.workspace = true
# Game constants and pure local types come in only through the facade (CLAUDE.md).
rustedscreep-consts.workspace = true

[dev-dependencies]
criterion.workspace = true

# Native only (`cargo bench -p rustedscreep-core`); criterion supplies the harness.
[[bench]]
name = "planner"
harness = false

[[bench]]
name = "combat"
harness = false
