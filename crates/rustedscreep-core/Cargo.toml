[package]
name = "rustedscreep-core"
description = "Pure, deterministic decision logic for the bot; native-testable, no JS dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rustc-hash.workspace = true
# Game constants and pure local types come in only through the facade (CLAUDE.md).
rustedscreep-consts = { path = "../rustedscreep-consts" }

[dev-dependencies]
criterion.workspace = true

# Native only (`cargo bench -p rustedscreep-core`); criterion supplies the harness.
[[bench]]
name = "planner"
harness = false

[[bench]]
name = "combat"
harness = false
