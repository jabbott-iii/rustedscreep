[package]
name = "rustedscreep-wasm"
description = "The WebAssembly module of rustedscreep, a Screeps: World bot: it snapshots the game each tick, issues the bot's intents, persists its state, and exports the loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["games", "wasm"]
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# A debug export that panics on demand, to test the loader's recovery (ADR-003, P1 gate).
trap-test = []
# A scripted intent producer for the act layer's sandbox test (js/tools/act-sim.mjs); never deployed.
act-test = []
# Sparse CPU spans per subsystem and the stats segment (ROADMAP P1 module 8); off, it compiles out.
profiler = []

[dependencies]
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
# Logging through `log` macros to a minimal logger that prints with `console.log` (logging.rs, ADR-014).
log.workspace = true
js-sys.workspace = true
# Game objects for the snapshot; no cargo features yet (V2, V87).
screeps-game-api.workspace = true
rustedscreep-core.workspace = true
# Constants the API does not export (extra.rs), such as the segment save cap the profiler checks.
rustedscreep-consts.workspace = true
