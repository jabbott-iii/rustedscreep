# Example credentials file for the API tools (npm run deploy, console and stats). They use screeps-api,
# which reads the screepers unified credentials format (SS3). Copy this file to .screeps.yaml, which is
# git-ignored, and fill in your own values. Never commit .screeps.yaml.
#
# MMO deploys go through the GitHub link from the tracked deploy/ folder (ADR-012), not through this file.
# The API tools need Node 22 or 24 (VERIFICATION_LOG V11) and are not written yet.
servers:
  mmo:
    host: screeps.com
    secure: true
    # Official servers take an auth token (account settings, Auth Tokens), not a password.
    token: YOUR_AUTH_TOKEN
    branch: default
  ptr:
    host: screeps.com
    secure: true
    path: /ptr
    token: YOUR_AUTH_TOKEN
    branch: default
  season:
    host: screeps.com
    secure: true
    path: /season
    token: YOUR_AUTH_TOKEN
    branch: default
  private:
    host: 127.0.0.1
    port: 21025
    # Anything but an explicit false means HTTPS.
    secure: false
    username: YOUR_USERNAME
    password: YOUR_PASSWORD
    branch: default
